name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client:
    name: Client — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Covers the pure functions only: gesture mapping, the One Euro filter,
      # the crossfade and cutoff curves, and the latency statistics. Webcam and
      # Web Audio need real hardware and are verified by hand before a demo.
      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
